services:
  sveltekit-app:
    build: .
    container_name: portfolio
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - caddy_net
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ORIGIN=https://mcjefd.dev
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host

networks:
  caddy_net:
    external: true
